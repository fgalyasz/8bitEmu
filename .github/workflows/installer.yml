name: Installer image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dmg:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: 8bitEmu
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_PUSH_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: fgalyasz/TenPrintSoftware
          path: TenPrintSoftware
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_PUSH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install company site tools
        working-directory: TenPrintSoftware
        run: npm ci
      - name: Import signing identity
        working-directory: 8bitEmu
        env:
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
          CODESIGN_KEYCHAIN_PASSWORD: ${{ secrets.CODESIGN_KEYCHAIN_PASSWORD }}
        run: bash scripts/ci_import_signing.sh 8bitemu-signing "8bitEmu Local"
      - name: Build installer image
        working-directory: 8bitEmu
        run: |
          chmod +x ./scripts/build_dmg.sh ./scripts/build-release.sh ./scripts/ci_import_signing.sh ./scripts/ci_commit_release.sh
          ./scripts/build_dmg.sh
      - name: Restore Cloudflare login
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN }}
          WRANGLER_CONFIG: ${{ secrets.WRANGLER_CONFIG }}
        run: |
          mkdir -p "${HOME}/Library/Preferences/.wrangler/config"
          cfg="${HOME}/Library/Preferences/.wrangler/config/default.toml"
          enc="$(gh variable get WRANGLER_CONFIG_ENC --repo fgalyasz/TenPrintSoftware 2>/dev/null || true)"
          if [[ -n "${enc}" ]] && printf '%s' "${enc}" | PASS="${GH_TOKEN}" openssl enc -d -aes-256-cbc -pbkdf2 -base64 -A -pass env:PASS > "${cfg}" 2>/dev/null && [[ -s "${cfg}" ]]; then
            echo "Restored live Cloudflare login from WRANGLER_CONFIG_ENC"
          elif [[ -n "${WRANGLER_CONFIG}" ]]; then
            printf '%s\n' "${WRANGLER_CONFIG}" > "${cfg}"
            echo "Restored Cloudflare login from WRANGLER_CONFIG secret"
          fi
          if [[ -s "${cfg}" ]]; then
            chmod 600 "${cfg}"
            cp "${cfg}" "${RUNNER_TEMP}/wrangler-before.toml"
          fi
      - name: Deploy product site
        working-directory: 8bitEmu
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          chmod +x ./scripts/deploy_site.sh
          ./scripts/deploy_site.sh
      - name: Publish company catalogue
        working-directory: TenPrintSoftware
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run sync:versions
          npm run build
          npm run deploy
      - name: Persist refreshed Cloudflare login
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN }}
        run: |
          cfg="${HOME}/Library/Preferences/.wrangler/config/default.toml"
          before="${RUNNER_TEMP}/wrangler-before.toml"
          if [[ -s "${cfg}" ]] && [[ -f "${before}" ]] && ! cmp -s "${cfg}" "${before}" && grep -q "oauth_token" "${cfg}"; then
            enc="$(PASS="${GH_TOKEN}" openssl enc -aes-256-cbc -pbkdf2 -salt -base64 -A -pass env:PASS -in "${cfg}")"
            gh variable set WRANGLER_CONFIG_ENC --repo fgalyasz/TenPrintSoftware --body "${enc}"
            for repo in DarkLab SnappyZones SessionGuard WalkAway MarkSweep 8bitEmu; do
              gh secret set WRANGLER_CONFIG --repo "fgalyasz/${repo}" < "${cfg}"
            done
          fi
      - name: Commit version
        working-directory: 8bitEmu
        run: bash scripts/ci_commit_release.sh
      - name: Commit company catalogue version
        working-directory: 8bitEmu
        env:
          TENPRINT_ROOT: ${{ github.workspace }}/TenPrintSoftware
        run: bash scripts/ci_commit_release.sh company
      - uses: actions/upload-artifact@v4
        with:
          name: 8bitEmu-installer
          path: 8bitEmu/dist/8bitEmu.dmg
          if-no-files-found: error
      - name: Notify on first success or recovery
        working-directory: TenPrintSoftware
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
          CONTACT_FROM: ${{ secrets.CONTACT_FROM }}
        run: |
          RELEASE_VERSION="$(tr -d ' \t\n\r' < ../8bitEmu/docs/version.txt 2>/dev/null || true)" \
            node scripts/notify_installer_recovery.mjs
